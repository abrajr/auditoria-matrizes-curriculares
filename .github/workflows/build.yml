name: Gerar aplicativos (Windows e macOS)

# Compila o aplicativo nos dois sistemas, em máquinas reais da nuvem do GitHub.
# Dispare manualmente na aba "Actions" (gera artefatos de build) ou empurre uma
# tag vX.Y (gera E publica os pacotes numa Release).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # necessário para anexar os pacotes a uma Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome_pacote: Auditoria_Matrizes-Windows
            pasta_dist: dist/Auditoria_Matrizes
          - os: macos-latest
            nome_pacote: Auditoria_Matrizes-macOS
            pasta_dist: dist/Auditoria_Matrizes-mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Gerar o aplicativo
        run: python build_exe.py

      - name: Compactar (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "${{ matrix.pasta_dist }}" -DestinationPath "${{ matrix.nome_pacote }}.zip"

      - name: Compactar (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "${{ matrix.pasta_dist }}" "${{ matrix.nome_pacote }}.zip"

      - name: Publicar como artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome_pacote }}
          path: ${{ matrix.nome_pacote }}.zip

  # Só roda quando o gatilho é uma tag: junta os dois pacotes numa única Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os pacotes gerados
        uses: actions/download-artifact@v4
        with:
          path: pacotes

      - name: Criar a Release e anexar os pacotes
        uses: softprops/action-gh-release@v2
        with:
          files: pacotes/**/*.zip
          body: |
            ## Aplicativo para Windows e macOS — não requer Python

            Baixe o pacote do seu sistema, extraia a pasta inteira e execute o app.

            - **Windows:** `Auditoria_Matrizes-Windows.zip` → `Auditoria_Matrizes.exe`
              Primeira execução: aviso do SmartScreen → **Mais informações → Executar assim mesmo**.
            - **macOS:** `Auditoria_Matrizes-macOS.zip` → `Auditoria_Matrizes.app`
              Primeira execução: **botão direito no app → Abrir → Abrir** (Gatekeeper). Veja `COMO-ABRIR-NO-MAC.txt`.

            > ⚠️ **Os dados que acompanham a ferramenta são FICTÍCIOS**, apenas para demonstração.
            > Para uso real, baixe o template CSV pelo próprio aplicativo e preencha com os dados da sua instituição.

            Instruções completas no `LEIA-ME.txt` dentro de cada pacote. Em caso de problema, rode o app com `--autoteste` (instruções no LEIA-ME) e envie o arquivo `Documentos/Auditoria_autoteste.txt` gerado.
